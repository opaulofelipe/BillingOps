name: Bootstrap BillingOps

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-billing-ops.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recriar billing_ops.rb
        shell: bash
        run: |
          mkdir -p app/services
          cat <<'PAYLOAD' > /tmp/billing_ops.rb.gz.b64
          
          PAYLOAD
          base64 -d /tmp/billing_ops.rb.gz.b64 | gzip -d > app/services/billing_ops.rb
          ruby -c app/services/billing_ops.rb

      - name: Commit do arquivo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/billing_ops.rb
          git rm .github/workflows/bootstrap-billing-ops.yml
          git commit -m "Adiciona BillingOps service"
          git push
